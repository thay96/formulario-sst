<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Capacitación SST</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="contenedor">
        <h1>Registro de Capacitación SST</h1>

        <form id="formularioSST">
            <label for="nombre_completo">Nombre completo</label>
            <input type="text" id="nombre_completo" name="nombre_completo" required>

            <label for="cedula">Cédula</label>
            <input type="text" id="cedula" name="cedula" required>

            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" name="cargo" required>

            <div id="mensajeCapacitacion"></div>
            <div id="preguntasDinamicas"></div>

            <label>Foto de confirmación *</label>
            <div id="camaraContainer">
                <video id="video" autoplay playsinline
                    style="width:100%; max-width:400px; border-radius:8px; display:block;"></video>
                <canvas id="canvas" style="display:none;"></canvas>
                <img id="preview" style="width:100%; max-width:400px; border-radius:8px; display:none;">
                <div style="margin-top:8px; display:flex; gap:8px;">
                    <button type="button" id="btnCapturar">📷 Tomar foto</button>
                    <button type="button" id="btnVoltear">📷 Voltear cámara</button>
                    <button type="button" id="btnRepetir" style="display:none;">🔄 Repetir</button>
                </div>
                <small id="fotoError" style="color:red; display:none;">Debes tomar una foto para poder enviar el
                    registro.</small>
            </div>

            <button type="submit">Enviar registro</button>
        </form>
        <a href="historial.html" style="display:block; margin-top:30px;">Ver historial</a> <a href="admin.html" style="display:block; margin-top:8px;">➕ Crear capacitación</a>

        <p id="mensaje"></p>
    </div>

    <script src="formulario.js"></script>
</body>

</html>
